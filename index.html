<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divar Hunter MVP</title>
<style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:16px;background:#f4f4f4}.box{background:#fff;padding:20px;border-radius:14px;margin-bottom:20px}input,button{padding:11px;margin:5px;border:1px solid #ddd;border-radius:8px}button{background:#222;color:#fff;cursor:pointer}pre{white-space:pre-wrap;direction:ltr;text-align:left;background:#111;color:#eee;padding:15px;border-radius:10px;overflow:auto}</style></head>
<body><div class="box"><h1>🔎 Divar Hunter — Search API</h1>
<p>تست اتصال به Search API کنار دیوار</p>
<input id="category" value="cars" placeholder="category"><input id="city" value="tehran" placeholder="city"><input id="query" placeholder="query اختیاری"><button id="go">جستجو</button></div>
<div class="box"><h2>نتیجه</h2><pre id="out">هنوز جستجویی انجام نشده.</pre></div>
<script>
const out=document.getElementById("out");
document.getElementById("go").onclick=async()=>{
 out.textContent="در حال ارسال درخواست...";
 try{const r=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({category:category.value,city:city.value,query:query.value})});out.textContent=JSON.stringify(await r.json(),null,2)}
 catch(e){out.textContent="خطا: "+e.message}
};
</script></body></html>
