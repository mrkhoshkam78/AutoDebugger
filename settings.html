<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Auto Debugger — browser-only static analysis" />
  <title>Settings · Auto Debugger V7.0</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="has-sidebar page-settings">
  <aside class="app-sidebar" id="appSidebar" aria-label="Main navigation">
    <div class="sidebar-brand"><span class="sidebar-logo">AD</span><span class="sidebar-title">Auto Debugger</span></div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="index.html"><span data-i18n="navAnalysis">Analysis</span></a>
      <a class="nav-item" href="assistant.html"><span data-i18n="navAssistant">Assistant</span></a>
      <a class="nav-item active" href="settings.html"><span data-i18n="navSettings">Settings</span></a>
    </nav>
    <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Close">×</button>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>
  <div class="app-shell">
    <header class="header">
      <div class="header-left">
        <button type="button" class="icon-btn menu-btn" id="sidebarOpen" aria-label="Menu">☰</button>
        <h1 data-i18n="navSettings">Settings</h1>
      </div>
    </header>
        <main class="settings-main">
      <section class="panel settings-card">
        <h2 data-i18n="settingsAppearance">Appearance</h2>
        <label><span data-i18n="settingsTheme">Theme</span>
          <select id="setTheme">
            <option value="dark" data-i18n="themeDark">Dark</option>
            <option value="light" data-i18n="themeLight">Light</option>
          </select>
        </label>
        <label><span data-i18n="settingsLang">UI language</span>
          <select id="setLang">
            <option value="en" data-i18n="langEn">English</option>
            <option value="fa" data-i18n="langFa">فارسی</option>
          </select>
        </label>
      </section>
      <section class="panel settings-card">
        <h2 data-i18n="settingsAnalysis">Analysis defaults</h2>
        <label><span data-i18n="settingsDefaultLevel">Default level</span>
          <select id="setLevel">
            <option value="1" data-i18n="levelQuick">Quick</option>
            <option value="2" data-i18n="levelFull">Full</option>
            <option value="3" data-i18n="levelDeep">Deep</option>
            <option value="4" data-i18n="levelSpecial">Special</option>
          </select>
        </label>
      </section>
      <section class="panel settings-card settings-collapsible" id="llmSection">
        <button type="button" class="collapse-toggle" id="llmToggle" aria-expanded="false">
          <span data-i18n="settingsLlmTitle">LLM Provider (optional)</span>
          <span class="collapse-chevron" aria-hidden="true">▸</span>
        </button>
        <div class="collapse-body" id="llmBody" hidden>
          <p class="hint" data-i18n="settingsLlmHint">API key stays in session only — never stored in source. Leave as None for local evidence mode.</p>
          <label><span data-i18n="settingsProvider">Provider</span>
            <select id="setProvider">
              <option value="none" data-i18n="providerNone">None (local)</option>
              <option value="openai-compatible" data-i18n="providerOpenAI">OpenAI-compatible endpoint</option>
            </select>
          </label>
          <label><span data-i18n="settingsEndpoint">Endpoint URL</span>
            <input type="url" id="setEndpoint" placeholder="https://api.example.com/v1/chat/completions" />
          </label>
          <label><span data-i18n="settingsModel">Model</span>
            <input type="text" id="setModel" placeholder="model-id" />
          </label>
          <label><span data-i18n="settingsApiKey">API Key</span>
            <input type="password" id="setApiKey" placeholder="sk-…" autocomplete="off" />
          </label>
          <button type="button" class="btn primary" id="saveLlm" data-i18n="settingsSaveLlm">Save LLM settings</button>
          <p id="llmSaveMsg" class="hint" hidden></p>
        </div>
      </section>
      <section class="panel settings-card">
        <h2 data-i18n="settingsStorage">Storage</h2>
        <button type="button" class="btn secondary" id="clearChatMem" data-i18n="settingsClearChat">Clear conversation memory</button>
        <button type="button" class="btn secondary" id="clearFindings" data-i18n="settingsClearFindings">Clear saved findings</button>
      </section>
    </main>
  </div>
  <script src="js/lib/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/results-store.js"></script>
  <script src="js/llm-assistant.js"></script>
  <script src="js/nav-shell.js"></script>
  <script src="js/settings-page.js"></script>
</body>
</html>
